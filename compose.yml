networks:
  default:
    name: mathutils

services:
  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
      target: prod
    volumes: !override
      - ./app-frontend:/srv/frontend:rw

  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
      target: prod

  gateway:
    image: nginx:alpine
    volumes: !override
      - ./gateway/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app-frontend:/usr/share/nginx/html:ro
    depends_on: !override
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  app-frontend:
