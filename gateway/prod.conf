server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        return 404;
    }

    # Sem barra final: preserva o prefixo /api/ enviado ao backend.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets inexistentes devem retornar 404, sem fallback para HTML.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Permite acessar diretamente as rotas da interface.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
