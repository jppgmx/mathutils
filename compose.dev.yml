networks:
  default:
    # Permite instalar dependências de desenvolvimento no contêiner.
    internal: false

services:
  frontend:
    build:
      target: dev
    volumes: !override
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      target: dev
    volumes: !override
      - ./apps/backend:/app

  gateway:
    volumes: !override
      - ./gateway/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: !override
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
