networks:
  default:
    name: mathutils

services:
  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
      target: dev
    volumes: !override
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
      target: dev
    volumes: !override
      - ./apps/backend:/app

  gateway:
    image: nginx:alpine
    volumes: !override
      - ./gateway/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: !override
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  frontend_node_modules:
